<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="js/embed-boot.js"></script>
<title>ترتيب الربحية — AI Media Buyer</title>
<script>(function(){try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/embed.css" />
<link rel="stylesheet" href="css/embed-fx.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar" class="sidebar"></div>
    <div class="main">
      <div class="page-header">
        <div>
          <h1>🏆 ترتيب الربحية</h1>
          <div class="subtitle">مش بس "مين بيبيع أكتر" — دي "مين بيكسبني أكتر فعليًا"</div>
        </div>
      </div>

      <div class="toolbar">
        <span class="muted" style="font-size:13px;">رتّب حسب:</span>
        <div class="chip-group" id="sortChips"></div>
      </div>

      <div class="table-wrap">
        <table class="data">
          <thead>
            <tr>
              <th>#</th>
              <th>المنتج</th>
              <th>صافي الربح (7 أيام)</th>
              <th>ربح الأوردر</th>
              <th>أقصى تكلفة أوردر مربحة</th>
              <th>تكلفة الأوردر الحالية</th>
              <th>نسبة المرتجعات</th>
              <th>أوردرات اليوم</th>
              <th>تقييم المنتج</th>
              <th>التوصية</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state" style="display:none">لا توجد منتجات بعد.</div>
    </div>
  </div>

  <script type="module" src="js/ranking.js"></script>
</body>
</html>
