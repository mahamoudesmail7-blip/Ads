<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>تحكم المدير — نظام مراقبة المنتجات</title>
<script>(function(){try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar" class="sidebar"></div>
    <div class="main">
      <div class="page-header">
        <div>
          <h1>👑 تحكم المدير</h1>
          <div class="subtitle" id="dateLabel">—</div>
        </div>
        <div class="toolbar">
          <button class="btn" id="btnAddTask">➕ إضافة Task</button>
          <button class="btn secondary small" id="btnMaterialize">🔄 تحديث المهام التلقائية</button>
          <input type="date" id="asOfDatePicker" class="ltr" style="width:auto" />
          <button class="btn secondary small" id="btnToday">اليوم</button>
          <button class="btn secondary small" id="btnYesterday">أمس</button>
          <button class="btn secondary small" id="btnManagerReport">📋 تقرير تحكم المدير</button>
          <button class="btn secondary small" id="btnActivityLog">📜 سجل تحكم المدير</button>
        </div>
        <input type="text" id="searchTask" placeholder="🔎 ابحث عن مهمة، منتج، موظف، تفاصيل..." style="max-width:260px" />
      </div>

      <div class="stat-grid" id="summaryTiles"></div>

      <!-- AI Intelligence <-> Manager Control bridge (additive; the team grid/task table below are unchanged) -->
      <div class="stat-grid" id="aiBridgeSummaryTiles" style="margin-bottom:18px;"></div>

      <div class="card" style="margin-bottom:22px;">
        <div class="section-title" style="margin-top:0;">🤖 قرارات AI تحتاج توزيع</div>
        <div class="chip-group" id="aiBridgeTabs" style="margin-bottom:14px;"></div>
        <div id="aiBridgeTabContent"></div>
      </div>

      <div class="card" id="aiBridgeReviewCard" style="margin-bottom:22px; display:none; border-color:var(--yellow);">
        <div class="section-title" style="margin-top:0;">⏳ تحتاج مراجعة</div>
        <div id="aiBridgeReviewBody"></div>
      </div>

      <div class="card" id="aiBridgeInProgressCard" style="margin-bottom:22px; display:none;">
        <div class="section-title" style="margin-top:0;">📋 متابعة تنفيذ المهام</div>
        <div id="aiBridgeInProgressBody"></div>
      </div>

      <div class="card" style="margin-bottom:22px;">
        <div class="section-title" style="margin-top:0;">👥 الفريق</div>
        <div class="employee-card-grid" id="teamCardsGrid"></div>
      </div>

      <div class="card" id="carriedOverCard" style="margin-bottom:22px; display:none; border-color:var(--yellow);">
        <div class="section-title" style="margin-top:0;">⚠️ مهام مرحّلة من أيام سابقة</div>
        <div id="carriedOverBody"></div>
      </div>

      <div class="toolbar">
        <div class="chip-group" id="employeeTabs"></div>
      </div>
      <div class="toolbar" style="margin-top:8px;">
        <input type="text" id="searchTask" placeholder="🔎 ابحث عن مهمة، منتج، موظف، تفاصيل..." style="max-width:280px" />
        <div class="chip-group" id="statusFilterChips"></div>
        <div class="chip-group" id="sourceFilterChips"></div>
      </div>
      <div class="toolbar" style="margin-top:8px;">
        <select id="priorityFilter" style="width:auto"><option value="ALL">كل الأولويات</option></select>
        <select id="typeFilter" style="width:auto"><option value="ALL">كل الأنواع</option></select>
        <select id="productFilter" style="width:auto"><option value="ALL">كل المنتجات</option></select>
      </div>

      <div class="toolbar" id="bulkBar" style="display:none; margin-top:10px; background:var(--bg-card); padding:10px 14px; border-radius:8px;">
        <span class="faint" id="bulkCount"></span>
        <button class="btn secondary small" id="btnBulkMove">👤 نقل المحدد</button>
        <button class="btn secondary small" id="btnBulkUrgent">🔴 جعلها عاجل</button>
        <button class="btn danger small" id="btnBulkCancel">🗑️ إلغاء المحدد</button>
      </div>

      <div class="table-wrap" style="margin-top:14px;">
        <table class="data">
          <thead>
            <tr>
              <th><input type="checkbox" id="selectAll" /></th>
              <th>المنتج / المهمة</th>
              <th>النوع</th>
              <th>أمس ← اليوم</th>
              <th>الفرق</th>
              <th>الأولوية</th>
              <th>الموظف</th>
              <th>الحالة</th>
              <th>المصدر</th>
              <th>إجراءات</th>
            </tr>
          </thead>
          <tbody id="taskTableBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state" style="display:none">لا توجد مهام مطابقة.</div>

      <div class="card" id="reportCard" style="margin-top:22px; display:none;">
        <div class="page-header" style="margin-bottom:10px; border:none; padding:0;">
          <div class="section-title" style="margin-top:0;">📋 تقرير تحكم المدير</div>
          <button class="btn secondary small" id="btnCloseReport">إغلاق</button>
        </div>
        <div id="reportBody" style="white-space:pre-wrap; line-height:1.9; font-size:13.5px; font-family: 'Courier New', monospace;"></div>
      </div>

      <div class="card" id="activityLogCard" style="margin-top:22px; display:none;">
        <div class="page-header" style="margin-bottom:10px; border:none; padding:0;">
          <div class="section-title" style="margin-top:0;">📜 سجل تحكم المدير</div>
          <button class="btn secondary small" id="btnCloseActivityLog">إغلاق</button>
        </div>
        <div id="activityLogBody"></div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Task modal -->
  <div id="taskModalOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:150; align-items:center; justify-content:center;">
    <div class="card" style="width:480px; max-width:94vw; max-height:88vh; overflow-y:auto;">
      <div class="section-title" style="margin-top:0" id="taskModalTitle">إضافة مهمة جديدة</div>
      <div class="field">
        <label>الموظف</label>
        <select id="fEmployee"></select>
      </div>
      <div class="field">
        <label>نوع المهمة</label>
        <select id="fTaskType">
          <option value="SCALE">🔥 Scale</option>
          <option value="REDUCE">⬇️ Reduce</option>
          <option value="REVIEW_PRODUCT">🚨 Review</option>
          <option value="MONITOR">👀 Monitor</option>
          <option value="TEST_CREATIVE">🧪 Creative</option>
          <option value="CAMPAIGN">🎯 Campaign</option>
          <option value="CHECK_STOCK">📦 Stock</option>
          <option value="OTHER">📌 Other</option>
        </select>
      </div>
      <div class="field">
        <label>المنتج (اختياري)</label>
        <select id="fProduct"><option value="">— بدون منتج محدد —</option></select>
      </div>
      <div class="field">
        <label>عنوان المهمة *</label>
        <input type="text" id="fTitle" />
      </div>
      <div class="field">
        <label>تفاصيل المهمة</label>
        <input type="text" id="fDetails" />
      </div>
      <div class="field">
        <label>الحملة المرتبطة (اختياري)</label>
        <input type="text" id="fCampaign" placeholder="مثال: حملة رمضان — Facebook" />
      </div>
      <div class="field-row">
        <div class="field">
          <label>الأولوية</label>
          <select id="fPriority">
            <option value="URGENT">🔴 عاجل</option>
            <option value="IMPORTANT" selected>🟠 مهم</option>
            <option value="NORMAL">🟡 عادي</option>
          </select>
        </div>
        <div class="field">
          <label>موعد التسليم</label>
          <input type="date" id="fDueDate" class="ltr" />
        </div>
      </div>
      <div class="field">
        <label>تاريخ التنفيذ</label>
        <input type="date" id="fExecutionDate" class="ltr" />
      </div>
      <div class="field">
        <label>📝 ملاحظة المدير (تظهر للموظف)</label>
        <input type="text" id="fManagerNote" />
      </div>
      <div class="toolbar" style="justify-content:flex-end; margin-top:6px;">
        <button class="btn secondary" id="btnCancelTaskModal">إلغاء</button>
        <button class="btn" id="btnSaveTask">حفظ</button>
      </div>
    </div>
  </div>

  <!-- Move Task modal -->
  <div id="moveModalOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:150; align-items:center; justify-content:center;">
    <div class="card" style="width:360px; max-width:94vw;">
      <div class="section-title" style="margin-top:0">👤 نقل المهمة</div>
      <div class="field">
        <label>إلى</label>
        <select id="fMoveTo"></select>
      </div>
      <div class="toolbar" style="justify-content:flex-end;">
        <button class="btn secondary" id="btnCancelMove">إلغاء</button>
        <button class="btn" id="btnConfirmMove">نقل المهمة</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/manager.js"></script>
</body>
</html>
