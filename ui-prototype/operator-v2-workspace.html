<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Operator V2 — نموذج مركز الحملات</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#101828;--mut:#667085;--line:#e4e7ec;--line2:#f0f2f6;--brand:#5b50f0;--brand2:#eeedff;--ok:#067647;--okbg:#e8f7ef;--warn:#b54708;--warnbg:#fff4e5;--bad:#b42318;--badbg:#fdeceb;--info:#175cd3;--infobg:#e8f0fe;--side:#0f1629;--sideink:#c9d2e8;--r:12px;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08)}
:root[data-theme=dark]{--bg:#0b1020;--card:#131a2e;--ink:#eef2fb;--mut:#98a2b8;--line:#232c46;--line2:#1b2339;--brand:#8a82ff;--brand2:#22285a;--okbg:#0f3a2b;--warnbg:#3d2f12;--badbg:#3f1a18;--infobg:#14284a;--side:#070b17;--sh:none}
*{box-sizing:border-box}html,body{overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Segoe UI",Tahoma,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;transition:grid-template-columns .2s}.app.col{grid-template-columns:68px 1fr}
.side{background:var(--side);color:var(--sideink);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;margin:2px 4px 16px}.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6d63ff,#8f7bff);display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.brand b{display:block;font-size:15.5px;color:#fff}.brand small{opacity:.65;font-size:12.5px}
.nb{display:flex;gap:11px;align-items:center;width:100%;text-align:right;border:0;background:transparent;color:inherit;padding:10px 11px;border-radius:9px;font-size:15px;margin-bottom:2px}.nb:hover{background:rgba(255,255,255,.06)}.nb.on{background:rgba(110,99,255,.28);color:#fff}
.nb .ic{width:22px;text-align:center;flex:none}.nb .badge{margin-right:auto;background:#f79009;color:#111;border-radius:20px;padding:0 8px;font-size:12.5px;font-weight:700}
.app.col .nb .tx,.app.col .brand div:last-child,.app.col .sf .tx{display:none}.app.col .nb .badge{display:none}
.sf{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1);display:grid;gap:6px}.sf button,.sf select{width:100%;text-align:right;padding:8px 10px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:inherit;font-size:14px}
main{min-width:0;padding:0 26px 90px}
.ribbon{background:var(--warnbg);color:var(--warn);border:1px dashed var(--warn);border-radius:10px;padding:7px 12px;font-size:13.5px;margin:16px 0 14px}
h1{font-size:24px;margin:0 0 2px}h2{font-size:18px;margin:0 0 10px}h3{font-size:15.5px;margin:0 0 6px}.lead{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh)}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.3fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.kpi b{display:block;font-size:26px;line-height:1.25;letter-spacing:-.3px}.kpi span{color:var(--mut);font-size:13.5px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:1px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}.info{background:var(--infobg);color:var(--info)}.gray{background:var(--line2);color:var(--mut)}.brandp{background:var(--brand2);color:var(--brand)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 14px;font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}.btn:hover{background:var(--line2)}.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{filter:brightness(1.08)}.btn.sm{padding:3px 10px;font-size:13px}.btn[disabled]{opacity:.45;cursor:not-allowed}.btn.dng{background:var(--bad);border-color:var(--bad);color:#fff}
.verdict{border-radius:10px;padding:11px 14px;font-weight:600;font-size:14.5px}
.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}.layer{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}.layer .t{display:flex;justify-content:space-between;font-weight:700;gap:6px}.layer small{display:block;color:var(--mut);font-size:12.5px}
.todo{list-style:none;margin:0;padding:0;counter-reset:s}.todo li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}.todo li:last-child{border:0}.todo .n{counter-increment:s;width:28px;height:28px;border-radius:50%;background:var(--brand2);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none}.todo .n::before{content:counter(s)}.todo .tx{flex:1}.todo small{display:block;color:var(--mut)}
.ready{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.rc{border:1px solid var(--line);border-radius:11px;padding:12px;background:var(--card);text-align:right;display:block;width:100%}.rc:hover{border-color:var(--brand)}.rc b{font-size:24px;display:block}.rc span{color:var(--mut);font-size:13px}

.sticky{position:sticky;top:0;z-index:9;background:var(--bg);padding:10px 0 2px}
.timebar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh)}
.timebar .seg{display:flex;gap:2px;flex-wrap:wrap}.timebar .seg button{border:0;background:transparent;padding:5px 11px;border-radius:8px;font-weight:600;color:var(--mut);font-size:14px}.timebar .seg button.on{background:var(--brand);color:#fff}.timebar .seg button:hover:not(.on){background:var(--line2)}
.timebar input[type=date]{border:1px solid var(--line);border-radius:8px;padding:3px 8px;background:var(--card)}
.sw{display:inline-flex;align-items:center;gap:7px;font-size:14px;margin-right:auto}.sw input{width:17px;height:17px;accent-color:var(--brand)}
.views{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 8px}.views button{border:1px solid var(--line);background:var(--card);padding:6px 13px;border-radius:20px;font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center}.views button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.views .c{background:var(--line2);color:var(--mut);border-radius:20px;padding:0 7px;font-size:12.5px}.views button.on .c{background:rgba(255,255,255,.2);color:inherit}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.tools input[type=search]{flex:1;min-width:200px;border:1px solid var(--line);border-radius:9px;padding:7px 12px;background:var(--card)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.chip{border:1px dashed var(--brand);background:var(--brand2);color:var(--brand);padding:3px 11px;border-radius:20px;font-size:13px;font-weight:600}.chip.on{background:var(--brand);color:#fff;border-style:solid}
.fb{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;display:none}.fb.open{display:block}
.fr{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}.fr select,.fr input{border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--card);min-width:90px}.fr input[type=number]{width:90px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:1px 10px;font-size:13px}.opt.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.sel-banner{border-radius:10px;padding:8px 14px;margin-bottom:8px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* table */
.tw{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:64vh;background:var(--card);box-shadow:var(--sh)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}th,td{padding:9px 11px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap;vertical-align:middle}
th{position:sticky;top:0;background:var(--bg);color:var(--mut);font-weight:600;z-index:2;cursor:pointer;user-select:none;font-size:13px}tr:hover td{background:var(--line2)}tr.sel td{background:var(--brand2)}
th.ck,td.ck{width:38px;position:sticky;right:0;z-index:3;background:var(--card)}th.ck{background:var(--bg)}tr.sel td.ck{background:var(--brand2)}
td.nm{position:sticky;right:38px;background:var(--card);z-index:1;min-width:230px;max-width:280px;white-space:normal}tr:hover td.nm{background:var(--line2)}tr.sel td.nm{background:var(--brand2)}th.nm{position:sticky;right:38px;z-index:3;background:var(--bg)}
td input[type=checkbox],th input[type=checkbox]{width:17px;height:17px;accent-color:var(--brand)}
.n{font-variant-numeric:tabular-nums}.sub{display:block;color:var(--mut);font-size:12px}.up{color:var(--ok);font-size:12px}.dn{color:var(--bad);font-size:12px}.mut{color:var(--mut)}
.pg{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 4px;color:var(--mut);font-size:14px;flex-wrap:wrap}
.cards{display:none}.cc{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px}.cc.sel{border-color:var(--brand);background:var(--brand2)}.cc .r{display:flex;justify-content:space-between;gap:8px}.cc .m{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:8px;font-size:13.5px}.cc .m span{color:var(--mut)}
/* bulk bar */
.bulk{position:fixed;bottom:14px;right:50%;transform:translateX(50%) translateY(140%);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:96vw;transition:transform .2s}.bulk.show{transform:translateX(50%) translateY(0)}
.bulk .cnt{font-weight:800;margin-left:6px}.bulk .btn{background:rgba(255,255,255,.12);border-color:transparent;color:inherit}.bulk .btn:hover{background:rgba(255,255,255,.22)}.bulk .btn.pri{background:var(--brand)}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(560px,100%);background:var(--card);border-right:1px solid var(--line);box-shadow:10px 0 40px rgba(0,0,0,.25);padding:20px;overflow:auto;transform:translateX(-105%);transition:transform .2s;z-index:60;visibility:hidden}.drawer.open{transform:none;visibility:visible}
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:50;display:none}.scrim.open{display:block}
.modal{position:fixed;inset:3vh 0 auto 0;margin:0 auto;width:min(980px,96vw);max-height:94vh;overflow:auto;background:var(--card);border-radius:16px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.35);padding:20px;z-index:70;display:none}.modal.open{display:block}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}.kv span{color:var(--mut)}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 12px}.steps span{padding:3px 11px;border-radius:20px;font-size:12.5px;font-weight:600;background:var(--line2);color:var(--mut)}.steps span.cur{background:var(--brand);color:#fff}.steps span.no{background:var(--badbg);color:var(--bad)}
.tot{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}.tot div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}.tot b{font-size:20px;display:block}.tot span{color:var(--mut);font-size:12.5px}
.fld{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.fld label{display:flex;gap:6px;align-items:center;font-size:14px}.fld input,.fld select{border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--card);width:100px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:100;display:none;font-weight:600;max-width:92vw}
.empty{text-align:center;color:var(--mut);padding:36px}
.burger{display:none}
@media(max-width:1100px){.g4{grid-template-columns:1fr 1fr}.ready{grid-template-columns:repeat(3,1fr)}.tot{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr}}
@media(max-width:860px){.app,.app.col{grid-template-columns:1fr}.side{position:fixed;inset:0 0 0 auto;width:270px;transform:translateX(105%);transition:.2s;z-index:80;visibility:hidden}.side.open{transform:none;visibility:visible}.burger{display:inline-flex}main{padding:0 12px 100px}.tw{display:none}.cards{display:block}.layers{grid-template-columns:1fr}.ready{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr}.app.col .nb .tx{display:inline}}
@media(max-width:860px){.sticky{position:static}}
@media(max-width:520px){.bulk{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:8px 10px}.bulk .btn{padding:6px 10px;font-size:13px;flex:none}.bulk .cnt{flex:none}.g4{grid-template-columns:1fr 1fr}.kpi b{font-size:21px}.tot{grid-template-columns:1fr 1fr}h1{font-size:21px}.timebar .seg button{padding:5px 8px;font-size:13px}.bulk{width:96vw;justify-content:center}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand"><div class="logo">AI</div><div><b>AI Operator</b><small>مساحة عمل Media Buying</small></div></div>
    <nav id="nav"></nav>
    <div class="sf">
      <select id="role" aria-label="الدور"><option value="EMPLOYEE">الدور: موظف</option><option value="MANAGER">الدور: مشرف</option><option value="ADMIN" selected>الدور: مسؤول</option></select>
      <button id="theme">🌙 <span class="tx">المظهر</span></button>
      <button id="collapse">⇤ <span class="tx">طي القائمة</span></button>
    </div>
  </aside>
  <main>
    <div class="ribbon">🧪 <b>نموذج تصميم محلي</b> — الأرقام والأسماء <b>بيانات تجريبية</b> (120 حملة وهمية) مش حقيقية، ومفيش اتصال بـ Meta أو بقاعدة البيانات أو أي تنفيذ.</div>
    <button class="btn burger" id="burger" style="margin-bottom:10px">☰ القائمة</button>
    <div id="view"></div>
  </main>
</div>
<div class="bulk" id="bulk"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================ SAMPLE DATA (fake, seeded) ============================ */
const rng = (seed) => { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; };
const ACCOUNTS = ['حساب تجريبي أ', 'حساب تجريبي ب']; const STORES = ['متجر تجريبي 1', 'متجر تجريبي 2'];
const PRODUCTS = [
  {n:'منتج تجريبي 1',t:100,r:130,h:200,stock:'OK',store:0},{n:'منتج تجريبي 2',t:90,r:120,h:180,stock:'OK',store:0},{n:'منتج تجريبي 3',t:110,r:140,h:210,stock:'LOW',store:0},
  {n:'منتج تجريبي 4',t:null,r:null,h:null,stock:'OK',store:0},{n:'منتج تجريبي 5',t:80,r:110,h:160,stock:'OUT',store:1},{n:'منتج تجريبي 6',t:100,r:130,h:200,stock:'OK',store:1},
  {n:'منتج تجريبي 7',t:70,r:100,h:150,stock:'OK',store:1},{n:'منتج تجريبي 8',t:null,r:null,h:null,stock:'UNKNOWN',store:1},{n:'منتج تجريبي 9',t:120,r:150,h:230,stock:'OK',store:0},
  {n:'منتج تجريبي 10',t:95,r:125,h:190,stock:'OK',store:1}
];
const PAUSE_REASONS = ['إيقاف يدوي','CPA فوق Hard Stop','صفر أوردرات','نفاد مخزون','إيقاف جدول يومي'];
const RAW = (() => { const R = rng(4242); const out = []; for (let i = 0; i < 120; i++) { const p = PRODUCTS[Math.floor(R() * PRODUCTS.length)]; const pi = PRODUCTS.indexOf(p);
  const active = R() < 0.55; const cpaBase = 40 + R() * 190; const budget = Math.round((150 + R() * 650) / 50) * 50; const dayShare = 0.25 + R() * 0.95;
  out.push({ id: 'FAKE-' + (10000 + i), name: `${p.n} _ ${['scale','test','new'][Math.floor(R()*3)]} ${1 + Math.floor(R() * 9)}`, product: pi, account: Math.floor(R() * 2), store: p.store, status: active ? 'ACTIVE' : 'PAUSED', btype: R() < 0.6 ? 'ABO' : 'CBO',
   budget, cpaBase, dayShare, linked: R() > 0.07, syncMin: R() < 0.08 ? 55 + Math.floor(R() * 60) : 2 + Math.floor(R() * 25), lastChangeDays: Math.floor(R() * 12), lastPausedDays: active ? null : 1 + Math.floor(R() * 40), pauseReason: active ? null : PAUSE_REASONS[Math.floor(R() * PAUSE_REASONS.length)],
   protectedC: R() < 0.06, excluded: R() < 0.05, approval: ['—','مرشح','جاهز للمراجعة','معتمد'][Math.floor(R() * 4)], lastDecision: ['—','فتح قبل 3 أيام','رفع ميزانية قبل 5 أيام','إيقاف قبل 9 أيام'][Math.floor(R() * 4)], revKnown: R() > 0.35, aov: 380 + Math.floor(R() * 220), changed: i % 17 === 0, zeroToday: active && R() < 0.22, losingDays: active ? (R() < 0.15 ? 3 + Math.floor(R() * 3) : 0) : 0, lastActiveDays: active ? 0 : 1 + Math.floor(R() * 40) }); }
  return out; })();
const PERIODS = [['today','اليوم',1],['yesterday','أمس',1],['last3','آخر 3 أيام',3],['last7','آخر 7 أيام',7],['last14','آخر 14 يوم',14],['last30','آخر 30 يوم',30],['last60','آخر 60 يوم',60],['last90','آخر 90 يوم',90],['custom','فترة مخصصة',null]];
const daysOf = () => { if (ST.period !== 'custom') return PERIODS.find(p => p[0] === ST.period)[2]; if (!ST.from || !ST.to) return 7; return Math.max(1, Math.round((new Date(ST.to) - new Date(ST.from)) / 864e5) + 1); };
const MIN_ORDERS = 5; const ZERO_LIMIT = 150; // sample thresholds — editable in the real product, never hard rules
function enrich(c, days, shift = 0) {
  const R = rng(c.id.length * 977 + parseInt(c.id.slice(5)) * 31 + days * 13 + shift * 7919); const pr = PRODUCTS[c.product];
  const spendDay = c.status === 'ACTIVE' ? c.budget * c.dayShare : c.budget * c.dayShare * 0.25 * (c.lastActiveDays <= days ? 1 : 0);
  const eff = c.cpaBase * (0.85 + R() * 0.35); const spendP = c.status === 'ACTIVE' ? spendDay * days * (0.85 + R() * 0.3) : (c.lastActiveDays < days + 20 ? spendDay * Math.min(days, 7) : 0);
  let ordersP = spendP > 0 ? Math.max(0, Math.round(spendP / eff)) : 0; if (c.status === 'PAUSED' && spendP === 0) ordersP = 0;
  const spendT = c.status === 'ACTIVE' ? Math.round(spendDay * (0.4 + R() * 0.5)) : 0; let ordersT = c.status === 'ACTIVE' ? Math.round(spendT / (eff * (0.9 + R() * 0.4))) : 0; if (c.zeroToday) { ordersT = 0; }
  const spendTt = c.zeroToday ? Math.max(spendT, 120 + Math.round(R() * 140)) : spendT;
  const cp = (d) => { const r2 = rng(c.id.length * 53 + parseInt(c.id.slice(5)) + d); return ordersP > 0 ? Math.round(c.cpaBase * (0.8 + r2() * 0.4)) : null; };
  const o30 = Math.round(spendDay * 30 / (c.cpaBase * 1.02)), o7 = Math.round(spendDay * 7 / c.cpaBase); const cpa30 = Math.round(c.cpaBase * 1.02), cpa7 = Math.round(c.cpaBase * 0.97);
  let winner = 'UNKNOWN'; if (pr.t != null) winner = o30 >= 10 && o7 >= 2 && cpa30 <= pr.t && cpa7 <= pr.t ? 'WINNER' : 'NOT_WINNER';
  const cpaP = ordersP > 0 ? Math.round(spendP / ordersP) : null; const rev = c.revKnown ? ordersP * c.aov : null; const roas = rev != null && spendP > 0 ? +(rev / spendP).toFixed(2) : null;
  return { ...c, productName: pr.n, target: pr.t, reduce: pr.r, hard: pr.h, stock: pr.stock, winner, spendP: Math.round(spendP), ordersP, spendT: Math.round(spendTt), ordersT, cpaT: ordersT > 0 ? Math.round(spendTt / ordersT) : null, cpaP, cpa7: cp(7) ?? null, cpa14: cp(14), cpa30: cp(30), cpa60: cp(60), roas, profit: rev != null && pr.t ? Math.round(rev * 0.3 - spendP) : null, accountName: ACCOUNTS[c.account], storeName: STORES[c.store] };
}

  <h3>الأداء</h3><div class="kv"><span>صرف / أوردرات (الفترة)</span><b>${fmt(r.spendP)} / ${fmt(r.ordersP)}</b></div><div class="kv"><span>CPA: اليوم · 7 · 14 · 30 · 60</span><b>${[r.cpaT, r.cpa7, r.cpa14, r.cpa30, r.cpa60].map(x => fmt(x)).join(' · ')}</b></div><div class="kv"><span>Target · Reduce · Hard Stop</span><b>${fmt(r.target)} · ${fmt(r.reduce)} · ${fmt(r.hard)}</b></div><div class="kv"><span>ROAS / الربح التقديري</span><b>${r.roas ?? '—'} / ${r.profit == null ? '—' : fmt(r.profit)}</b></div><div class="kv"><span>المخزون</span><b>${r.stock}</b></div><div class="kv"><span>آخر مزامنة</span><b>${r.syncMin} د</b></div>
  <h3 style="margin-top:12px">لماذا هذه التوصية؟</h3><p>${E(e.why.join(' · '))}</p>
  <h3>سجل التغييرات</h3><div class="kv"><span>قبل ${r.lastChangeDays} أيام</span><b>ميزانية ${fmt(r.budget * 0.8)} → ${fmt(r.budget)}</b></div><div class="kv"><span>قبل ${r.lastChangeDays + 6} يوم</span><b>${r.lastDecision}</b></div>
  <h3 style="margin-top:12px">أداء قبل وبعد آخر تعديل ميزانية (3 أيام)</h3><div class="kv"><span>CPA قبل → بعد</span><b>${before} → ${after}</b></div><p class="mut" style="font-size:12.5px">بيانات تجريبية للتوضيح.</p>
  <h3>سبب آخر إيقاف</h3><p>${r.status === 'ACTIVE' ? 'لم تُوقف' : E(r.pauseReason) + ` (قبل ${r.lastPausedDays} يوم)`}</p>`; $('drawer').classList.add('open'); $('scrim').classList.add('open'); }
/* ============================ SAVED VIEWS / EXPORT / EVENTS ============================ */
const loadViews = () => { try { return JSON.parse(localStorage.getItem('opv2.views.' + ST.role) || '[]'); } catch { return []; } }; const storeViews = (a) => { try { localStorage.setItem('opv2.views.' + ST.role, JSON.stringify(a)); } catch { /* private mode */ } };
function toast(t) { const x = $('toast'); x.textContent = t; x.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => (x.style.display = 'none'), 3200); }
function closeAll() { ['drawer', 'modal'].forEach(i => $(i).classList.remove('open')); $('scrim').classList.remove('open'); }
function exportCsv(rowsIn) { const rows = rowsIn || (selCount() ? selectedRows() : matching()); const cols = ST.cols.filter(k => k !== 'name'); const head = ['الحملة', 'ID', ...cols.map(k => colDef(k)[1])]; const strip = (h) => String(h).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(); const csv = [head, ...rows.map(r => [r.name, r.id, ...cols.map(k => strip(colDef(k)[2](r)))])].map(a => a.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' })); a.download = 'campaigns-sample.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 500); toast(`اتصدّر ${rows.length} حملة (CSV يفتح في Excel) — بيانات تجريبية`); }
function applyBuiltin(name) { ST.view = { 'حملات ممتازة': 'up', 'تحتاج إيقاف': 'pause', 'فرص توسع': 'up', 'تحتاج مراجعة': 'review' }[name] || 'all'; ST.tpl = null; ST.conds = name === 'حملات ممتازة' ? [{ f: 'cpaP', op: 'between', v: [20, 80] }] : []; ST.page = 1; touchScope('غيّرت العرض'); render(); }
document.addEventListener('click', (e) => { const t = e.target; const g = (s) => t.closest(s);
  let el;
  if ((el = g('[data-sec]'))) { ST.sec = el.dataset.sec; $('side').classList.remove('open'); return render(); }
  if ((el = g('[data-openview]'))) { ST.sec = 'camps'; ST.view = el.dataset.openview; ST.tpl = null; ST.page = 1; return render(); }
  if ((el = g('[data-period]'))) { ST.period = el.dataset.period; if (ST.period === 'custom' && !ST.from) { const d = new Date(); ST.to = d.toISOString().slice(0, 10); d.setDate(d.getDate() - 6); ST.from = d.toISOString().slice(0, 10); } touchScope('غيّرت الفترة'); ST.page = 1; return render(); }
  if ((el = g('[data-view]'))) { ST.view = el.dataset.view; ST.tpl = null; ST.page = 1; touchScope('غيّرت العرض'); return render(); }
  if ((el = g('[data-tpl]'))) { ST.tpl = ST.tpl === el.dataset.tpl ? null : el.dataset.tpl; ST.page = 1; touchScope('غيّرت القالب'); return render(); }
  if ((el = g('[data-fbtoggle]'))) { ST.fbOpen = !ST.fbOpen; return render(); }
  if ((el = g('[data-logic]'))) { ST.logic = el.dataset.logic; touchScope('غيّرت منطق الفلاتر'); return render(); }
  if (g('[data-addcond]')) { ST.conds.push({ f: 'cpaP', op: 'between', v: [] }); ST.fbOpen = true; return render(); }
  if ((el = g('[data-delcond]'))) { ST.conds.splice(+el.dataset.delcond, 1); touchScope('غيّرت الفلاتر'); return render(); }
  if (g('[data-resetf]')) { ST.conds = []; ST.tpl = null; ST.q = ''; ST.page = 1; touchScope('أعدت ضبط الفلاتر'); return render(); }
  if ((el = g('[data-copt]'))) { const [i, o] = el.dataset.copt.split('|'); const c = ST.conds[+i]; c.v = c.v || []; c.v = c.v.includes(o) ? c.v.filter(x => x !== o) : [...c.v, o]; touchScope('غيّرت الفلاتر'); return render(); }
  if ((el = g('[data-sort]'))) { const k = el.dataset.sort; ST.sort = { k, d: ST.sort.k === k ? -ST.sort.d : -1 }; return render(); }
  if ((el = g('[data-page]'))) { ST.page = +el.dataset.page; return render(); }
  if (g('[data-colpick]')) { const html = COLS.map(c => `<label style="display:flex;gap:8px;padding:4px 0"><input type="checkbox" data-col="${c[0]}" ${ST.cols.includes(c[0]) ? 'checked' : ''} ${c[0] === 'name' ? 'disabled' : ''}> ${c[1]}</label>`).join(''); $('drawer').innerHTML = `<button class="btn sm" data-close="1" style="float:left">تم ✓</button><h2>الأعمدة</h2><p class="mut">اختار الأعمدة اللي تظهر. بيتحفظ لكل مستخدم.</p>${html}`; $('drawer').classList.add('open'); $('scrim').classList.add('open'); return; }
  if (g('[data-export]')) return exportCsv();
  if (g('[data-saveview]')) { const name = prompt('اسم العرض المحفوظ؟', 'عرضي ' + (loadViews().length + 1)); if (!name) return; const a = loadViews(); a.push({ name, view: ST.view, period: ST.period, logic: ST.logic, conds: ST.conds, cols: ST.cols, sort: ST.sort, tpl: ST.tpl, shared: can('MANAGER') && confirm('مشاركة العرض مع الفريق (حسب الصلاحيات)؟') }); storeViews(a); toast('اتحفظ العرض (في النموذج: على المتصفح بس)'); return render(); }
  if ((el = g('[data-detail]'))) return showDetail(el.dataset.detail);
  if ((el = g('[data-selact]'))) { const a = el.dataset.selact; if (a === 'cancel') clearSel(); if (a === 'all') { ST.sel.all = true; ST.sel.excl = new Set(); ST.sel.ids = new Set(); ST.sel.total = matching().length; } if (a === 'reconfirm') { const rows = matching(); ST.sel = { ids: new Set(), all: true, excl: new Set(), stale: false, total: rows.length }; } return render(); }
  if ((el = g('[data-bact]'))) { const k = el.dataset.bact; if (k === 'export') return exportCsv(); if (k === 'excl') { openReview('excl'); return; } return openReview(k); }
  if (g('[data-close]') || t === $('scrim')) return closeAll();
  if ((el = g('[data-rev]'))) { const a = el.dataset.rev; if (a === 'refresh') { REV.refreshed = true; REV.at = new Date(); showReview(); toast('اتعادت المعاينة وفحص الأهلية'); } if (a === 'create') { const n = $('modal').querySelectorAll('.pill.ok').length; closeAll(); toast(`اتجهزت خطة مسودة تجريبية (${n} حملة) — مفيش تنفيذ على Meta`); } return; }
});
document.addEventListener('change', (e) => { const t = e.target; let m;
  if (t.id === 'pageAll') { const rows = matching().slice((ST.page - 1) * ST.size, ST.page * ST.size); rows.forEach(r => setSel(r.id, t.checked)); return render(); }
  if (t.dataset.pick) { setSel(t.dataset.pick, t.checked); return render(); }
  if (t.dataset.col) { const k = t.dataset.col; ST.cols = t.checked ? [...ST.cols, k] : ST.cols.filter(x => x !== k); ST.cols = COLS.map(c => c[0]).filter(x => ST.cols.includes(x)); return render(); }
  if (t.id === 'cmpSw') { ST.compare = t.checked; return render(); }
  if (t.id === 'dFrom' || t.id === 'dTo') { ST[t.id === 'dFrom' ? 'from' : 'to'] = t.value; touchScope('غيّرت الفترة'); return render(); }
  if (t.dataset.cf !== undefined) { ST.conds[+t.dataset.cf] = { f: t.value, op: 'between', v: [] }; touchScope('غيّرت الفلاتر'); return render(); }
  if (t.dataset.cop !== undefined) { ST.conds[+t.dataset.cop].op = t.value; touchScope('غيّرت الفلاتر'); return render(); }
  if (t.dataset.cval !== undefined) { const [i, j] = t.dataset.cval.split('|'); const c = ST.conds[+i]; const f = FIELDS.find(x => x[0] === c.f); if (f[2] === 'text') c.v = t.value; else { c.v = c.v || []; c.v[+j] = t.value; } touchScope('غيّرت الفلاتر'); return render(); }
  if (t.id === 'savedSel') { const v = t.value; if (v.startsWith('b:')) applyBuiltin(v.slice(2)); else if (v.startsWith('u:')) { const s = loadViews()[+v.slice(2)]; Object.assign(ST, { view: s.view, period: s.period, logic: s.logic, conds: s.conds, cols: s.cols, sort: s.sort, tpl: s.tpl, page: 1 }); touchScope('طبّقت عرضًا محفوظًا'); render(); } return; }
  if (t.dataset.rem) { t.checked ? REV.removed.add(t.dataset.rem) : REV.removed.delete(t.dataset.rem); return showReview(); }
  if (t.dataset.bp) { const k = t.dataset.bp; REV.params[k] = k === 'mode' ? t.value : +t.value; return showReview(); }
  if (t.id === 'role') { ST.role = t.value; if (ST.sec === 'set' && !can('MANAGER')) ST.sec = 'home'; return render(); }
});
document.addEventListener('input', (e) => { if (e.target.id === 'q') { ST.q = e.target.value; ST.page = 1; touchScope('غيّرت البحث'); clearTimeout(window.__qt); window.__qt = setTimeout(render, 160); } });
$('theme').onclick = () => { ST.theme = ST.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = ST.theme; };
$('collapse').onclick = () => $('app').classList.toggle('col'); $('burger').onclick = () => $('side').classList.toggle('open');
render();
</script>
