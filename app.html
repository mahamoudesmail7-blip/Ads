<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AI Media Buyer — مركز التحكم</title>
<meta name="theme-color" content="#0b1437" />
<script>(function(){try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;var c=localStorage.getItem('shellCollapsed');if(c==='1')document.documentElement.classList.add('sh-collapsed');}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" />
<link rel="stylesheet" href="css/shell.css" />
<link rel="stylesheet" href="css/shell-fx.css" />
</head>
<body>
  <div class="sh-app" id="shApp">
    <div class="sh-scrim" id="shScrim" hidden></div>

    <aside class="sh-side" id="shSide" aria-label="القائمة الرئيسية">
      <div class="sh-brand">
        <span class="sh-logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg></span>
        <span class="sh-brand-text"><b>AI Media Buyer</b><small>مركز التحكم بالتجارة الإلكترونية</small></span>
        <button type="button" class="sh-iconbtn sh-collapse" id="shCollapse" aria-label="طي القائمة" title="طي / فتح القائمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      </div>

      <label class="sh-search" for="shSearch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="shSearch" type="search" placeholder="ابحث في القوائم…" autocomplete="off" />
        <kbd>Ctrl K</kbd>
      </label>

      <nav class="sh-nav" id="shNav" aria-label="الأقسام"></nav>

      <div class="sh-user" id="shUser"></div>
    </aside>

    <div class="sh-body">
      <header class="sh-top">
        <button type="button" class="sh-iconbtn sh-burger" id="shBurger" aria-label="فتح القائمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
        <div class="sh-crumb" id="shCrumb" aria-live="polite"></div>
        <div class="sh-actions">
          <button type="button" class="sh-iconbtn" id="shReload" aria-label="تحديث الصفحة" title="تحديث الصفحة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><polyline points="21 3 21 8 16 8"/></svg></button>
          <button type="button" class="sh-iconbtn" id="shNewTab" aria-label="فتح في تبويب جديد" title="فتح في تبويب جديد"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></button>
          <button type="button" class="sh-iconbtn" id="shTheme" aria-label="تبديل المظهر" title="تبديل المظهر (فاتح / داكن)"><svg class="sh-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="sh-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
        </div>
      </header>

      <div class="sh-slides" id="shSlides" role="tablist" aria-label="أقسام الصفحة" hidden>
        <button type="button" class="sh-arrow" id="shSlidePrev" aria-label="السابق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
        <div class="sh-track" id="shTrack"></div>
        <button type="button" class="sh-arrow" id="shSlideNext" aria-label="التالي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      </div>

      <main class="sh-stage" id="shStage">
        <div class="sh-loading" id="shLoading" aria-hidden="true"><div class="sh-bar"></div><div class="sh-sk a"></div><div class="sh-sk b"></div><div class="sh-sk c"></div></div>
        <iframe id="shFrame" title="محتوى الصفحة" referrerpolicy="same-origin"></iframe>
      </main>
    </div>
  </div>
  <script type="module" src="js/shell.js"></script>
</body>
</html>
