<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>إنشاء حساب — نظام مراقبة المنتجات</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;">
    <div class="card" style="width:420px; max-width:100%;">
      <div style="text-align:center; margin-bottom:18px;">
        <div style="font-size:22px; font-weight:700;">📈 نظام مراقبة المنتجات</div>
        <div class="faint" style="font-size:13px;">مركز التحكم بالتجارة الإلكترونية</div>
      </div>

      <div id="registerForm">
        <div class="section-title" style="margin-top:0; font-size:15px;">إنشاء حساب جديد</div>
        <div class="field" style="margin-bottom:10px;">
          <label>الاسم الكامل</label>
          <input type="text" id="fName" />
        </div>
        <div class="field" style="margin-bottom:10px;">
          <label>البريد الإلكتروني</label>
          <input type="email" id="fEmail" class="ltr" autocomplete="username" />
        </div>
        <div class="field" style="margin-bottom:10px;">
          <label>تاريخ الميلاد</label>
          <input type="date" id="fDob" class="ltr" />
        </div>
        <div class="field" style="margin-bottom:10px;">
          <label>كلمة المرور</label>
          <input type="password" id="fPassword" class="ltr" autocomplete="new-password" />
          <div class="faint" style="font-size:11.5px; margin-top:4px;">8 أحرف على الأقل، وتحتوي على حرف ورقم.</div>
        </div>
        <div class="field" style="margin-bottom:14px;">
          <label>تأكيد كلمة المرور</label>
          <input type="password" id="fConfirmPassword" class="ltr" autocomplete="new-password" />
        </div>
        <button class="btn" id="btnRegister" style="width:100%;">إنشاء الحساب</button>
        <div id="registerError" class="faint" style="margin-top:10px; color:var(--red, #e5484d); display:none;"></div>
        <div style="text-align:center; margin-top:14px;">
          <a href="login.html" class="faint" style="font-size:12.5px;">عندك حساب بالفعل؟ سجّل دخول</a>
        </div>
      </div>

      <div id="pendingNotice" style="display:none; text-align:center;">
        <div style="font-size:32px; margin-bottom:10px;">⏳</div>
        <div style="margin-bottom:14px; line-height:1.7;" id="pendingMessage"></div>
        <a href="login.html" class="btn secondary" style="display:inline-block;">رجوع لتسجيل الدخول</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/register-page.js"></script>
</body>
</html>
