<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="js/embed-boot.js"></script>
<title>تاسكات اليوم — AI Media Buyer</title>
<script>(function(){try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/embed.css" />
<link rel="stylesheet" href="css/embed-fx.css" />
<link rel="stylesheet" href="css/daily-tasks.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar" class="sidebar"></div>
    <div class="main dtk">
      <div class="dtk-head">
        <div class="dtk-title">
          <h1>🎯 تاسكات اليوم</h1>
          <div class="dtk-sub" id="dtkSub">—</div>
        </div>
        <div class="dtk-datenav">
          <button class="dtk-ib" id="dtkPrev" aria-label="اليوم اللي قبله">▶</button>
          <input type="date" id="dtkDate" class="ltr" />
          <button class="dtk-ib" id="dtkNext" aria-label="اليوم اللي بعده">◀</button>
          <button class="dtk-btn" id="dtkToday">النهارده</button>
        </div>
      </div>

      <div class="dtk-bar">
        <div class="dtk-tabs" role="tablist" id="dtkTabs">
          <button class="on" data-tab="day">📋 اليوم</button>
          <button data-tab="follow">📊 المتابعة</button>
          <button data-tab="team" data-mgr>👥 الفريق</button>
          <button data-tab="settings" data-mgr>⚙️ الإعدادات</button>
        </div>
        <div class="dtk-actions" id="dtkActions" data-mgr>
          <button class="dtk-btn primary" id="dtkAdd">➕ مهمة</button>
          <button class="dtk-btn" id="dtkRefresh" title="يقرا الحملات دلوقتي ويضيف أي مشكلة جديدة ويقفل اللي اتحلّت">🔄 تحديث</button>
          <button class="dtk-btn" id="dtkRebalance" title="يوزّع المهام اللي لسه ماتبدأتش بالتساوي من جديد">⚖️ توزيع بالتساوي</button>
        </div>
      </div>

      <div id="dtkBody"><div class="dtk-empty">بحمّل…</div></div>
    </div>
  </div>
  <script type="module" src="js/daily-tasks.js"></script>
</body>
</html>
