<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>قاعدة العملاء — نظام مراقبة المنتجات</title>
<script>(function(){try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar" class="sidebar"></div>
    <div class="main">
      <div class="page-header">
        <div>
          <h1>👥 قاعدة العملاء</h1>
          <div class="subtitle">عملاء حقيقيون من Easy Orders، مدمجون تلقائيًا برقم الهاتف — لا بيانات وهمية</div>
        </div>
      </div>

      <div class="toolbar">
        <input type="text" id="custSearch" placeholder="🔎 ابحث بالاسم، رقم الهاتف، أو رقم الأوردر..." style="max-width:320px" />
      </div>

      <div class="table-wrap" style="margin-top:14px;">
        <table class="data">
          <thead>
            <tr>
              <th>الاسم</th>
              <th>الهاتف</th>
              <th>المحافظة</th>
              <th>إجمالي الأوردرات</th>
              <th>مؤكدة</th>
              <th>مُستلمة</th>
              <th>آخر أوردر</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="custTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Details drawer -->
  <div class="drawer-overlay" id="custDrawerOverlay">
    <div class="drawer-panel" id="custDrawerPanel"></div>
  </div>

  <script type="module" src="js/customers.js"></script>
</body>
</html>
