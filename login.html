<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>تسجيل الدخول — نظام مراقبة المنتجات</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;">
    <div class="card" style="width:380px; max-width:100%;">
      <div style="text-align:center; margin-bottom:18px;">
        <div style="font-size:22px; font-weight:700;">📈 نظام مراقبة المنتجات</div>
        <div class="faint" style="font-size:13px;">مركز التحكم بالتجارة الإلكترونية</div>
      </div>

      <div id="loginForm">
        <div class="section-title" style="margin-top:0; font-size:15px;">تسجيل الدخول</div>
        <div class="field" style="margin-bottom:10px;">
          <label>البريد الإلكتروني</label>
          <input type="email" id="fEmail" class="ltr" autocomplete="username" />
        </div>
        <div class="field" style="margin-bottom:14px;">
          <label>كلمة السر</label>
          <input type="password" id="fPassword" class="ltr" autocomplete="current-password" />
        </div>
        <button class="btn" id="btnLogin" style="width:100%;">دخول</button>
        <div id="loginError" class="faint" style="margin-top:10px; color:var(--red, #e5484d); display:none;"></div>
        <div style="text-align:center; margin-top:14px;">
          <a href="register.html" class="faint" style="font-size:12.5px;">مفيش حساب؟ اعمل واحد</a>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
