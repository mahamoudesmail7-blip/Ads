<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Easy Orders — نظام مراقبة المنتجات</title>
<script>(function(){try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar" class="sidebar"></div>
    <div class="main">
      <div class="page-header">
        <div>
          <h1>🛒 Easy Orders</h1>
          <div class="subtitle">متابعة وتحليل أداء الأوردرات بسهولة</div>
        </div>
        <div class="chip-group" id="rangeChips"></div>
      </div>

      <div class="stat-grid" id="eoStatTiles"></div>

      <div class="card" style="margin-bottom:22px;">
        <div class="section-title" style="margin-top:0;">📊 أداء الأوردرات</div>
        <div class="eo-compare-bars" id="eoCompareBars"></div>
        <div class="eo-compare-note" id="eoCompareNote"></div>
      </div>

      <div class="section-title">📦 أداء المنتجات اليوم</div>
      <div class="table-wrap" style="margin-bottom:22px;">
        <table class="data">
          <thead>
            <tr>
              <th>المنتج</th>
              <th>اليوم</th>
              <th>أمس</th>
              <th>التغيير</th>
            </tr>
          </thead>
          <tbody id="eoProductsBody"></tbody>
        </table>
      </div>

      <div class="section-title">🏆 أفضل المنتجات اليوم</div>
      <div class="card" style="margin-bottom:22px;">
        <div id="eoTopProducts"></div>
      </div>

      <div class="section-title">⚠️ يحتاج انتباه</div>
      <div id="eoAlerts" style="margin-bottom:22px;"></div>

      <div class="section-title">✅ مهام اليوم</div>
      <div class="card">
        <div id="eoTasks"></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/easy-orders.js"></script>
</body>
</html>
